---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-gateway
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: cilium-gateway-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/infra/configs/cilium-gateway"
  prune: true
  wait: true
