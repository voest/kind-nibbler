---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-single
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: logging-helm
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/victoria-logs-single"
  prune: true
