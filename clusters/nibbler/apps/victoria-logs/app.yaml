---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: logging
  dependsOn:
    - name: victoria-metrics-operator
      namespace: victoria-metrics-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/victoria-logs"
  prune: true
