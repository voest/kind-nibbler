---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: redis-operator
  sourceRef:
    kind: GitRepository
