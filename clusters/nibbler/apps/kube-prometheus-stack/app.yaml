---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 15m
  targetNamespace: observability
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/kube-prometheus-stack"
  prune: true
  postBuild:
    substitute:
      chartVersion: "86.2.0"
