---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics-stack
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/victoria-metrics-stack"
  prune: true
