---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey-example-sentinel
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: valkey-example
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/valkey-sentinel"
  prune: true
  postBuild:
    substitute:
      instance: "replica"
