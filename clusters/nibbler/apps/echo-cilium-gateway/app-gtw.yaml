---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echo-cilium-gtw
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: echo-cilium-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/echo-gtw"
  prune: true
  patches:
    # Hacky hack: Skip `BackendTrafficPolicy` for Cilium Envoy
    # See https://github.com/kubernetes-sigs/kustomize/issues/1593
    - patch: |
        $patch: delete
        apiVersion: gateway.envoyproxy.io/v1alpha1
        kind: BackendTrafficPolicy
        metadata:
          name: http-echo-compression
  postBuild:
    substitute:
      gateway: "cilium-gateway"
      gatewayNamespace: "cilium-gateway-system"
      servicePrefix: "echo-cilium-gateway"
      servicePort1: "8080"
      servicePort2: "8090"
      serviceWeight1: "25"
      serviceWeight2: "75"
      var_substitution_enabled: "true"
    substituteFrom:
      - kind: ConfigMap
        name: custom-vars-echo-cilium-gtw
        optional: true
