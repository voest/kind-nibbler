---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-echo
  namespace: echo-cilium-gatway
spec:
  hostnames:
    - echo-example
    - echo-example.nibbler.dahaegga.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium-gateway
      namespace: cilium-gateway-system
  rules:
    - filters:
        - responseHeaderModifier:
            add:
              - name: Cache-Control
                value: max-age=60, public
              - name: X-Powered-By
                value: Bash
          type: ResponseHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
    - backendRefs:
        - name: echo-cilium-gateway-1
          kind: Service
          port: 8080
          weight: 25
        - name: echo-cilium-gateway-2
          kind: Service
          port: 8090
          weight: 75
