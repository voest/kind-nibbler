---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echo-envoy-gateway-2
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: echo-envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/echo"
  prune: true
  postBuild:
    substitute:
      instance: "echo-envoy-gateway-2"
      replicas: "2"
      port: "6090"
