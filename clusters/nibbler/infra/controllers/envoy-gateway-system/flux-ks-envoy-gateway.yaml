---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-system
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: envoy-gateway-system
  dependsOn:
    - name: redis-operator
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/infra/controllers/envoy-gateway"
  prune: true
  wait: true
