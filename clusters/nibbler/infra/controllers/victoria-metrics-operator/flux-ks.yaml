---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: victoria-metrics-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/infra/controllers/victoria-metrics-operator"
  prune: true
  wait: true
