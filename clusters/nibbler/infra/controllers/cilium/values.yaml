---
# Be kubeproxy-free with Ciliums eBPF replacement
k8sServiceHost: "nibbler-control-plane"
k8sServicePort: "6443"
kubeProxyReplacement: true

# Match kind defaults
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

# Gateway API
gatewayAPI:
  enabled: true
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN # default
        - SYS_ADMIN # default
        - NET_BIND_SERVICE # required to bind to port < 1024
l2announcements:
  enabled: true

# Observability
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack

# Hubble
hubble:
  relay:
    enabled: false
  ui:
    enabled: false
