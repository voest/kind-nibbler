---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis-operator
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: redis-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/infra/controllers/redis-operator"
  prune: true
  wait: true
