---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-redis-ratelimit
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: envoy-gateway-system
  dependsOn:
    - name: redis-operator
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: "/apps/redis-standalone"
  prune: true
  postBuild:
    substitute:
      instance: "ratelimit"
