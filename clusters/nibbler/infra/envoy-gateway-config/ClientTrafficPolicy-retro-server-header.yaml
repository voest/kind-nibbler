---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: retro-server-header
  namespace: envoy-gateway-system
spec:
  # [TargetSelector](https://gateway.envoyproxy.io/v1.6/api/extension_types/#targetselector) did
  # not work for me. Configured in the same and the `envoy-gateway-system` namespace.
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: envoy-gateway
  headers:
    lateResponseHeaders:
      add:
        - name: "x-custom-header"
          value: "true"
      set:
        - name: "server"
          value: "Microsoft-IIS/8.0"
