---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 5m
  timeout: 15m
  releaseName: envoy-gateway
  targetNamespace: "envoy-gateway-system"
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: envoy-gateway-values
      valuesKey: values.yaml
