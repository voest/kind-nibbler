---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 5m
  timeout: 15m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 1h
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
