---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
spec:
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "29.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus
  driftDetection:
    mode: enabled
  interval: 15m
  timeout: 5m
