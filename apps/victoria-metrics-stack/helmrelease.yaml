---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-stack
spec:
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.98.1"
      # version: ${chartVersion}
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
  driftDetection:
    mode: enabled
  interval: 15m
  timeout: 5m
  values:
    fullnameOverride: "vmstack"
    alertmanager:
      enabled: false
    defaultDashboards:
      dashboards:
        k8s-resources-multicluster:
          enabled: false
        k8s-resources-windows-cluster:
          enabled: false
        k8s-resources-windows-namespace:
          enabled: false
        k8s-resources-windows-pod:
          enabled: false
        k8s-windows-cluster-rsrc-use:
          enabled: false
        k8s-windows-node-rsrc-use:
          enabled: false
        nodes-aix:
          enabled: false
        nodes-darwin:
          enabled: false
        prometheus:
          enabled: false
        prometheus-remote-write:
          enabled: false
      sources:
        victoriametrics-operator:
          enabled: true
        victorialogs-single-node:
          enabled: true
        victorialogs-vlagent:
          enabled: true
    grafana:
      sidecar:
        dashboards:
          searchNamespace: ALL
    kubeProxy:
      enabled: false
    vmalert:
      enabled: false
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "7d"
        storage:
          resources:
            requests:
              storage: 1Gi
    vlagent:
      enabled: true
      spec:
        k8sCollector:
          enabled: true
          excludeFilter: "kubernetes.pod_namespace:in(observability,kube-system)"
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: http-metrics
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
              serverName: localhost
    kubeEtcd:
      service:
          port: 2381
          targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: http
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: http-metrics
            scheme: https
            tlsConfig:
              insecureSkipVerify: true
              serverName: 127.0.0.1
    prometheus-node-exporter:
      vmScrape:
        spec:
          endpoints:
            - port: metrics
              relabelConfigs:
                - action: replace
                  sourceLabels: [__meta_kubernetes_pod_node_name]
                  targetLabel: instance
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: "/var/lib/kubelet/pods.+"
