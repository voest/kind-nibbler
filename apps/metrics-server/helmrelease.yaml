---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  chart:
    spec:
      chart: metrics-server
      version: ${chartVersion:="3.12.2"}
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  driftDetection:
    mode: enabled
  interval: 15m
  timeout: 5m
  values:
    args:
      - --kubelet-insecure-tls
