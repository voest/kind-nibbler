---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-${instance}
spec:
  chart:
    spec:
      chart: valkey
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: valkey
  driftDetection:
    mode: enabled
  interval: 15m
  timeout: 5m
  values:
    fullnameOverride: valkey-${instance}
    extraConfig: |
      maxmemory 32mb
      maxmemory-policy allkeys-lru
    resources:
      requests:
        cpu: 100m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 96Mi
