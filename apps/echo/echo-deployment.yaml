---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ${instance:=echo}
  name: ${instance:=echo}
spec:
  replicas: ${replicas:=1}
  selector:
    matchLabels:
      app: ${instance:=echo}
  template:
    metadata:
      labels:
        app: ${instance:=echo}
    spec:
      containers:
      - image: gcr.io/kubernetes-e2e-test-images/echoserver:2.2
        name: ${instance:=echo}
        ports:
        - containerPort: 8080
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
