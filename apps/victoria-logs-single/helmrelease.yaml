---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-single
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: victoria-logs-single
      version: "0.13.6"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: 1h
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: victoria-logs-single-values
      valuesKey: values-vls.yaml
      optional: true
  values:
    dashboards:
      enabled: true
      namespace: observability
      labels:
        grafana_dashboard: "1"
    server:
      persistentVolume:
        size: 1Gi
      retentionPeriod: 7d
      serviceMonitor:
        enabled: true
        extraLabels:
          release: kube-prometheus-stack
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: victoria-logs-collector
      version: "0.3.4"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: 1h
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: victoria-logs-single-values
      valuesKey: values-vlc.yaml
      optional: true
  values:
    excludeFilter: kubernetes.pod_namespace:in(observability,kube-system)
    remoteWrite:
      - url: http://victoria-logs-single-server:9428
    podMonitor:
      enabled: true
      extraLabels:
        release: kube-prometheus-stack
